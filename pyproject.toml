[project]
name = "riskdiff"
version = "0.1.0"
description = "GitHub Diff for SEC filings: compares Item 1A (Risk Factors) between a company's two most recent 10-Ks."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic~=2.14",
  "httpx~=0.28.1",
  "beautifulsoup4~=4.15",
  "lxml~=6.1",
  "pysbd~=0.3.4",
  "spacy~=3.8.16",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "sentence-transformers~=6.1",
  "torch~=2.14",
  "scipy~=1.18",
  "numpy~=2.5",
  "scikit-learn~=1.9",
  "diff-match-patch==20241021",
  "fastapi~=0.143",
  "uvicorn[standard]~=0.54",
  "sse-starlette~=3.5",
  "python-dotenv~=1.2",
  "jsonschema~=4.26",
  "huggingface-hub>=1.3,<2.0",
  "google-genai~=2.29",
]

[dependency-groups]
dev = [
  "pytest~=9.1",
  "pytest-asyncio~=1.4",
  "respx~=0.23",
  "ruff~=0.17",
  "playwright~=1.63",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
