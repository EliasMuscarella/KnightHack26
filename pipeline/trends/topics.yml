# RiskDiff curated topic lexicon (used by pipeline/trends/derive.py).
#
# Matching rules (applied by code, not by this file):
#   * case-insensitive, whole words only: a synonym never matches inside a longer word
#     ("tariff" does not match "tariffs", "China" does not match "Chinatown"), so plurals are
#     listed explicitly where they are wanted;
#   * multi-word synonyms match across any run of whitespace;
#   * a topic counts for a risk factor only when one of its synonyms appears in THIS year's added
#     or modified sentences and NONE of its synonyms appears anywhere in last year's text of that
#     risk factor ("newly added language", never a claim about risk levels).
# Synonyms are deliberately precise: no single generic words that match boilerplate
# (e.g. "duties" alone would match "fiduciary duties"; "visa" alone would match the card network).
# Bump TOPICS_VERSION whenever a topic or synonym changes: it is part of every derived file.

TOPICS_VERSION: 1

topics:
